<!-- Toast Notifications -->
<div id="toast-container"></div>
{% if messages %}
<script>
  (function(){
    var map = { success:'#22c55e', error:'#ef4444', warning:'#f59e0b', info:'#3b82f6' };
    var messages = [
      {% for message in messages %}
      { text: "{{ message|escapejs }}", tag: "{{ message.tags }}" }{% if not forloop.last %},{% endif %}
      {% endfor %}
    ];
    messages.forEach(function(m, i){
      setTimeout(function(){
        var color = map[m.tag] || '#6366f1';
        var el = document.createElement('div');
        el.style.cssText = 'display:flex;align-items:center;gap:10px;background:'+color+';color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,.15);font-size:14px;font-family:Inter,sans-serif;font-weight:500;min-width:260px;max-width:360px;animation:toastIn .3s ease;';
        el.innerHTML = '<span style="flex:1">'+m.text+'</span><button onclick="this.parentElement.remove()" style="background:none;border:none;color:#fff;font-size:18px;cursor:pointer;line-height:1;opacity:.8;">&times;</button>';
        document.getElementById('toast-container').appendChild(el);
        setTimeout(function(){ el.style.animation='toastOut .3s ease forwards'; setTimeout(function(){ el.remove(); }, 300); }, 4000);
      }, i * 200);
    });
  })();
</script>
{% endif %}
<style>
  #toast-container { position:fixed; bottom:24px; right:24px; z-index:9999; display:flex; flex-direction:column; gap:10px; }
  @keyframes toastIn  { from { opacity:0; transform:translateX(40px); } to { opacity:1; transform:translateX(0); } }
  @keyframes toastOut { from { opacity:1; transform:translateX(0); } to { opacity:0; transform:translateX(40px); } }
</style>
{% block scripts %}{% endblock %}
